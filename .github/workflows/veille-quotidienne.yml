name: McDo Radar - veille quotidienne
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/veille-quotidienne.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: mcdo-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Récupérer les actualités françaises et RH
        run: python scripts/update_news.py
      - name: Sauvegarder les données
        run: |
          git config user.name "McDo Radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if ! git diff --cached --quiet; then
            git commit -m "Actualisation de la veille" && git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
